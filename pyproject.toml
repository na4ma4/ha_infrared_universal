[project]
name = "ha-infrared-universal"
version = "0.3.0"
description = "Universal Remote Infrared Proxy custom integration for Home Assistant"
requires-python = ">=3.14.2"
dependencies = [
  "infrared-protocols==9.0.0",
]

[dependency-groups]
dev = [
  "homeassistant==2026.6.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-homeassistant-custom-component>=0.13.300",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"custom_components/universal_remote_proxy/decoder.py" = ["E501", "UP035"]
